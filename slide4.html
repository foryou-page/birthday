<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Song For You</title>

    <link rel="stylesheet" href="style2.css">

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500&family=Sacramento&display=swap" rel="stylesheet">
</head>

<body>

    <main class="music-slide">

        <div class="music-content">

            <p class="music-small">
                A LITTLE SONG
            </p>

            <h1>
                this song<br>
                is for you ♡
            </h1>


            <!-- MUSIC PLAYER -->

            <div class="music-card">

                <div class="music-cover">
                    ♫
                </div>

                <div class="music-info">

                    <p class="song-title">
                        Your Special Song
                    </p>

                    <p class="song-artist">
                        a little something for you
                    </p>

                </div>


                <audio controls>
                    <source src="music.mp3" type="audio/mpeg">
                    Browser kamu tidak mendukung audio.
                </audio>

            </div>


            <p class="music-note">
                put on your headphones ♡
            </p>


            <!-- LANJUT -->

            <a href="slide5.html" class="music-next">
                there's one more thing
                <span>→</span>
            </a>

        </div>

    </main>

</body>

</html>
